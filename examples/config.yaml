version: 1

listen: "127.0.0.1:8080"

bearer_token_env: ""

backends:
  - name: "ollama-local"
    kind: "ollama"
    base_url: "http://127.0.0.1:11434"
    max_inflight: 4
    response_header_timeout_ms: 120000
    bearer_token_env: ""

aliases:
  - name: "local-chat"
    routes:
      - backend: "ollama-local"
        upstream_model: "qwen3:0.6b"
        priority: 10
